name: GDI reference capture

# Renders a grid of fonts with real Windows GDI and with Wine using the same
# font files, then diffs them. Only runs when started by hand or when the
# capture tool changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/gdiref/**'
      - '.github/workflows/gdiref.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/gdiref
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - run: x86_64-w64-mingw32-gcc -O2 -Wall -municode -o gdiref.exe tools/gdiref/gdiref.c -lgdi32
      - uses: actions/upload-artifact@v4
        with:
          name: gdiref-exe
          path: gdiref.exe

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gdiref-exe
      - run: .\gdiref.exe windows-out
      - uses: actions/upload-artifact@v4
        with:
          name: gdiref-windows
          path: windows-out
          retention-days: 14

  wine:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/gdiref
      - uses: actions/download-artifact@v4
        with:
          name: gdiref-exe
      - uses: actions/download-artifact@v4
        with:
          name: gdiref-windows
          path: out/windows
      - run: sudo apt-get update -q && sudo apt-get install -y -q wine64 xvfb
      - name: Run under Wine with the Windows font files
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ github.workspace }}/wpfx
        run: |
          WINE=$(command -v wine64 || echo /usr/lib/wine/wine64)
          xvfb-run -a $WINE wineboot -i || true
          mkdir -p "$WINEPREFIX/drive_c/windows/Fonts"
          for f in out/windows/fonts/*; do
            n=$(basename "$f" | tr ' ' '_' | tr 'A-Z' 'a-z')
            cp "$f" "$WINEPREFIX/drive_c/windows/Fonts/$n"
          done
          xvfb-run -a $WINE wineserver -k || true
          xvfb-run -a $WINE gdiref.exe 'Z:'"$(pwd | tr '/' '\\')"'\out\wine'
      - name: Run FreeType configured to approximate GDI
        run: |
          python3 -m pip install -q freetype-py
          python3 tools/gdiref/ftref.py out/windows/fonts out/freetype
          FTREF_INTERP=40 python3 tools/gdiref/ftref.py out/windows/fonts out/freetype-v40
          FTREF_NOVDMX=1 python3 tools/gdiref/ftref.py out/windows/fonts out/freetype-novdmx
      - name: Compare
        run: |
          python3 -I tools/gdiref/compare.py out/windows out/wine --md out/summary.md --sheets out/sheets > /dev/null
          echo "===== WINE vs WINDOWS ====="; sed -n '/identical fraction/,$p' out/summary.md | grep -v "^- ("
          python3 -I tools/gdiref/compare.py out/windows out/freetype --md out/summary-freetype.md > /dev/null
          cat out/summary.md out/summary-freetype.md >> "$GITHUB_STEP_SUMMARY"
          echo "===== FREETYPE ====="; sed -n '/identical fraction/,$p' out/summary-freetype.md | grep -v "^- ("
          echo "===== WINDOWS PPEM ====="
          python3 -I - <<'PY'
          import json
          for line in open("out/windows/configs.jsonl"):
              c = json.loads(line)
              if c["aa"] == 0:
                  print(c["face"], c["weight"], c["tall"], "ppem", c["tmHeight"] - c["tmInternalLeading"], "h", c["tmHeight"], "asc", c["tmAscent"], "desc", c["tmDescent"])
          PY
          echo "===== FONT INFO ====="
          python3 -I -c "import json; [print(json.dumps(i)) for i in json.load(open('out/freetype/fontinfo.json'))]"
          for v in v40 novdmx; do
            python3 -I tools/gdiref/compare.py out/windows out/freetype-$v --md out/summary-freetype-$v.md > /dev/null
            echo "===== FREETYPE $v ====="; sed -n '/identical fraction/,$p' out/summary-freetype-$v.md | grep -v "^- ("
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gdiref-wine-and-summary
          path: |
            out/wine
            out/freetype
            out/summary.md
            out/summary-freetype.md
            out/sheets
          retention-days: 14
